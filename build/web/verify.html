<!DOCTYPE html>
<!-- Created by CodingLab |www.youtube.com/c/CodingLabYT-->
<html lang="en" dir="ltr">

    <head>
        <meta charset="UTF-8">
        <!--<title> Login and Registration Form in HTML & CSS | CodingLab </title>-->
        <link rel="stylesheet" href="registation/style.css">
        <!-- Fontawesome CDN Link -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
         <!-- Load SweetAlert2 from CDN -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    </head>

    <body>
        <div class="container">
            <input type="checkbox" id="flip">
            <div class="cover">
                <div class="front">
                    <img src="registation/images/frontImg.jpg" alt="">
                    <div class="text">
                        <span class="text-1">Join now to explore the latest trends, timeless classics, and exclusive fashion deals.<br> Let's elevate your wardrobe together!</span>
                        <span class="text-2">Let's get connected</span>
                    </div>
                </div>
                <div class="back">
                    <img class="backImg" src="registation/images/backImg.jpg" alt="">
                    <div class="text">
                        <span class="text-1">Complete miles of journey <br> with one step</span>
                        <span class="text-2">Let's get started</span>
                    </div>
                </div>
            </div>
            <div class="forms">
                <div class="form-content">
                    <div class="login-form">
                        <div class="title">Login</div>
                        <form action="#">
                            <div class="input-boxes">
                                
                                <div class="button input-box">
                                    <input type="button" value="Log In" onclick="window.location.href='signIn.html';">
                                </div>
                                <div class="text sign-up-text">Are you not verified? <label for="flip">Verify</label></div>
                                
                             </div>
                        </form>
                    </div>
                    <div class="signup-form">
                        <div class="title" style="margin-bottom: 20px;">Verify</div>
                        <form action="#">
                            
                            <div class="input-box">
                                    <i class="fa-solid fa-gear"></i>
                                    <input type="text" placeholder="Enter your Verification Code" required id="code">
                                </div>
                            
                            <div class="button input-box">
                                <input type="button" value="Verify me" onclick="verifyMe();">
                                </div>
                            <div class="input-boxes">
                                <div class="text sign-up-text"><label for="flip">Login now</label></div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <script src="registation/js/verify.js"></script>
    </body>

</html>
