<!DOCTYPE html>
<html>
    <head>
        <title>SweetAlert2 Example</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- Load SweetAlert2 from CDN -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    </head>
    <body>
        <div>SweetAlert2 and Normal Alert Demo</div>
        
        <button type="button" onclick="sweetalert();">Sweet Alert</button>
        <br/>
        <button type="button" onclick="normalalert();">Normal Alert</button>
        
        <!-- Link to the external JS file -->
        <script src="registation/js/test.js"></script>
    </body>
</html>
