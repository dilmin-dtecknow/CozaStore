<html lang="en" dir="ltr">

    <head>
        <meta charset="UTF-8">
        <!--<title> Login and Registration Form in HTML & CSS | CodingLab </title>-->
        <link rel="stylesheet" href="registation/style.css">
        <!-- Fontawesome CDN Link -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Load SweetAlert2 from CDN -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    </head>

    <body>
        <div class="container">
            <input type="checkbox" id="flip">
            <div class="cover">
                <div class="front">
                    <img src="registation/images/buyer_dweb_business.jpg" alt="">
                    <div class="text">
                        <span class="text-1">Every new friend is a <br> new adventure</span>
                        <span class="text-2">Let's get connected</span>
                    </div>
                </div>
                <div class="back">
                    <img class="backImg" src="registation/images/backImg.jpg" alt="">
                    <div class="text">
                        <span class="text-1">Complete miles of journey <br> with one step</span>
                        <span class="text-2">Let's get started</span>
                    </div>
                </div>
            </div>
            <div class="forms">
                <div class="form-content">
                    <div class="login-form">
                        <div class="title">Seller SignUp</div>
                        <p id="seller_upmessage" style="color: #f14949;"></p>
                        <form action="#">
                            <div class="input-boxes">
                                <!--                                <div class="input-box">
                                                                    <i class="fas fa-envelope"></i>
                                                                    <input type="text" placeholder="Enter your email" required>
                                                                </div>
                                                                <div class="input-box">
                                                                    <i class="fas fa-lock"></i>
                                                                    <input type="password" placeholder="Enter your password" required>
                                                                </div>
                                                                <div class="text"><a href="#">Forgot password?</a></div>
                                                                <div class="text" style="color:  #c2c2d6;  text-align: end;"><input class="checkbox" type="checkbox" value=""/> Remember Me</div>
                                                                <div class="button input-box">
                                                                    <input type="button" value="Sumbit">
                                                                </div>-->
                                <div class="input-box">
                                    <i class="fas fa-user"></i>
                                    <input type="text" placeholder="Enter your First Name" required id="seller_fname"  oninput="capitalizeFirstLetter(this)">
                                </div>
                                <div class="input-box">
                                    <i class="fas fa-user"></i>
                                    <input type="text" placeholder="Enter your Last Name" id="seller_lname" required oninput="capitalizeFirstLetter(this)">
                                </div>
                                <div class="input-box">
                                    <i class="fas fa-envelope"></i>
                                    <input type="text" placeholder="Enter your email" id="seller_email" required value="">
                                </div>
                                <div class="input-box">
                                    <i class="fas fa-lock"></i>
                                    <input type="password" placeholder="Enter your password" id="seller_password" required value="">
                                </div>
                                <div class="input-box">
                                    <i class="fas fa-lock"></i>
                                    <input type="password" placeholder="Confirm your password" id="seller_conf_password" required value="" oninput="SellerheckPasswordMatch();">

                                </div>
                                <span id="seller_msg" style="color: red;"></span>
                                <div class="button input-box">
                                    <input type="button" value="Sumbit" onclick="sellerSignUp();">
                                </div>
                                <div class="text sign-up-text">Don you want to buy product? <label for="flip">Coustommer Login</label></div>
                                <div class="text sign-up-text">Already have an account? <label for="flip"><a href="signIn.html">Log In</a></label></div>
                            </div>
                        </form>
                    </div>
                    <div class="signup-form">
                        <div class="title" style="margin-bottom: 20px;">Signup</div>
                        <p id="message" style="color: #f14949;"></p>
                        <form action="#">
                            <div class="input-boxes">
                                <div class="input-box">
                                    <i class="fas fa-user"></i>
                                    <input type="text" placeholder="Enter your First Name" required id="first_name" oninput="capitalizeFirstLetter(this)">
                                </div>
                                <div class="input-box">
                                    <i class="fas fa-user"></i>
                                    <input type="text" placeholder="Enter your Last Name" required id="last_name" oninput="capitalizeFirstLetter(this)">
                                </div>
                                <div class="input-box">
                                    <i class="fas fa-envelope"></i>
                                    <input type="text" placeholder="Enter your email" required value="" id="email">
                                </div>
                                <div class="input-box">
                                    <i class="fas fa-lock"></i>
                                    <input type="password" placeholder="Enter your password" required value="" id="password">
                                </div>
                                <div class="input-box">
                                    <i class="fas fa-lock"></i>
                                    <input type="password" placeholder="Confirm your password" required value="" id="confirm_password" oninput="checkPasswordMatch();">

                                </div>
                                <span id="error_message" style="color: red;"></span>
                                <div class="button input-box">
                                    <input type="button" value="Sumbit" onclick="signUp();">
                                </div>
                                <div class="text sign-up-text">Do you want to sell your Product? <label for="flip">Seller SignUp</label></div>
                                <div class="text sign-up-text">Already have an account? <label for="flip"><a href="signIn.html">Log In</a></label></div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <script src="registation/js/signUp.js"></script>
    </body>

</html>
